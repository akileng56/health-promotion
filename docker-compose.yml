services:
  postgres:
    image: postgres:16-alpine
    container_name: promotions_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-promotions_db}
      POSTGRES_USER: ${DB_USER:-postsuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postspassword}
    ports:
      - "5478:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: promotions_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      CORS_ORIGIN: http://localhost:3218
      FRONTEND_URL: http://localhost:3218
    ports:
      - "8421:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: promotions_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3218:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
